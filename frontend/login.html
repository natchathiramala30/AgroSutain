<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Sign In – AgroSustain</title>
    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; background: radial-gradient(circle at 10% 20%, rgba(16, 185, 129, 0.12), transparent 40%), radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.08), transparent 40%), #f0f7f3;">

    <!-- Navbar -->
    <header class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon"><i class="fa-solid fa-wheat-awn"></i></div>
                <span>Agro<span>Sustain</span></span>
            </a>
            <div class="nav-actions">
                <a href="register.html" class="btn btn-outline btn-sm">Create Account</a>
            </div>
        </div>
    </header>

    <!-- Main Auth Card -->
    <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
        <div style="background: white; border-radius: var(--radius-xl); border: 1px solid rgba(16, 185, 129, 0.2); box-shadow: var(--shadow-lg); width: 100%; max-width: 440px; padding: 2.5rem 2rem; position: relative; overflow: hidden;">
            
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="width: 60px; height: 60px; background: rgba(16, 185, 129, 0.15); color: var(--primary-dark); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 1rem;">
                    <i class="fa-solid fa-user-lock"></i>
                </div>
                <h2 style="font-size: 1.8rem; color: var(--forest-dark);">Farmer Sign In</h2>
                <p style="font-size: 0.9rem; color: var(--text-muted);">Access your smart farming dashboard and AI recommendations</p>
            </div>

            <!-- Demo 1-Click Button -->
            <div style="background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: var(--radius-md); padding: 0.75rem 1rem; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <span style="font-size: 0.75rem; font-weight: 700; color: #475569; text-transform: uppercase;">Quick Evaluation</span>
                    <p style="font-size: 0.82rem; color: #64748b;">Pre-fill Demo Farmer account</p>
                </div>
                <button type="button" class="btn btn-sm btn-primary" onclick="fillDemoFarmer()" id="btnFillDemo">
                    <i class="fa-solid fa-bolt"></i> Auto Fill
                </button>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="loginEmail">Email Address</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-envelope" style="position: absolute; left: 14px; top: 14px; color: #94a3b8;"></i>
                        <input type="email" class="form-control" id="loginEmail" placeholder="farmer@agrosustain.org" style="padding-left: 2.5rem;" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPassword">Password</label>
                    <div style="position: relative;">
                        <i class="fa-solid fa-lock" style="position: absolute; left: 14px; top: 14px; color: #94a3b8;"></i>
                        <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" style="padding-left: 2.5rem;" required>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem;">
                    <label style="display: flex; align-items: center; gap: 0.4rem; color: #64748b; cursor: pointer;">
                        <input type="checkbox" checked style="accent-color: var(--primary);"> Remember me
                    </label>
                    <a href="#" style="color: var(--primary-dark); text-decoration: none; font-weight: 600;">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;" id="btnLoginSubmit">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid #eef2f6; font-size: 0.9rem; color: var(--text-muted);">
                Don't have an account yet? 
                <a href="register.html" style="color: var(--primary-dark); font-weight: 700; text-decoration: none;">Register here</a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
