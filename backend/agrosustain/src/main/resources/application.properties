# ==========================================================
# AgroSustain - Spring Boot Configuration
# ==========================================================

server.port=8080
spring.application.name=AgroSustain

# --- Database Configuration (MySQL Primary) ---
spring.datasource.url=jdbc:mysql://localhost:3306/agrosustain_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Embedded H2 In-Memory Fallback Console (Optional testing) ---
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# --- Python AI/ML Microservice Endpoint ---
ai.service.url=http://localhost:5000

# --- File Upload Settings (for Plant Leaf Images) ---
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# --- Logging ---
logging.level.com.agrosustain=INFO
logging.level.org.springframework.web=INFO
